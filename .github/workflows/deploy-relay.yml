# Relay webhook Zalo chạy trên Vercel, tách riêng để chỉ deploy khi thư mục relay/ thay đổi.
name: Deploy relay Zalo

on:
  push:
    branches: [main]
    paths:
      - relay/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Vercel
    if: github.repository == 'minhhieuphamit/FamilyMemorialReminder'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: relay-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json
      - run: npm ci
      - run: npm ci --prefix relay
      - run: npx vitest run tests/zalo-relay.test.ts tests/card-service.test.ts
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy relay --prod --yes --name family-memorial-zalo-relay --token "$VERCEL_TOKEN"
      # Secret sai phải bị từ chối: 401 cho thấy relay chạy và gọi được Worker.
      - name: Kiểm tra sau deploy
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors -X POST -H 'content-type: application/json' -H 'x-bot-api-secret-token: ci-probe' -d '{}' https://family-memorial-zalo-relay.vercel.app/api/zalo)" = 401
          # Hàm vẽ thiệp: 401 là đã có CARD_RENDER_SECRET; 503 là chưa đặt biến này trên Vercel (Worker sẽ dùng Browser Run).
          status="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors -X POST -H 'content-type: application/json' -H 'x-card-secret: ci-probe' -d '{}' https://family-memorial-zalo-relay.vercel.app/api/card)"
          if [ "$status" = 503 ]; then echo "::warning::Chưa đặt CARD_RENDER_SECRET trên Vercel, thiệp sẽ dùng Browser Run"; else test "$status" = 401; fi
