# Kiểm tra mọi pull request và push; chỉ push lên main mới deploy lên Cloudflare.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Kiểm tra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy Cloudflare
    needs: check
    # Fork không có secret và không được deploy vào hệ thống thật.
    if: github.repository == 'minhhieuphamit/FamilyMemorialReminder' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # Hai lần push sát nhau chạy lần lượt, không hủy giữa chừng khi đang migrate.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Migration phải chạy trước deploy, theo DEPLOYMENT.md.
      - name: Chạy migration
        run: npm run db:migrate:remote
      - name: Deploy
        run: npm run deploy
      - name: Kiểm tra sau deploy
        env:
          SITE_URL: https://family-memorial-reminder.minhhieupham2002.workers.dev
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$SITE_URL/")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$SITE_URL/api/families")" = 401
